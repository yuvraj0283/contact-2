version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: contact_management_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - contact_network

  backend:
    build: ./backend
    container_name: contact_management_api
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/contact_management?authSource=admin
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - contact_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: contact_management_app
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - contact_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  contact_network:
    driver: bridge
